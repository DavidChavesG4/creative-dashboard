<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Creative 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --blue: #58a6ff; --green: #3fb950; --yellow: #d29922;
    --red: #f85149; --purple: #bc8cff; --orange: #ffa657;
    --teal: #39d353;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .header h1 span { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .last-updated { color: var(--muted); font-size: 12px; }
  .btn-refresh { background: var(--blue); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .2s; }
  .btn-refresh:hover { opacity: .85; }
  .btn-refresh:disabled { opacity: .5; cursor: not-allowed; }

  .tabs-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 4px; }
  .tab-btn { background: none; border: none; color: var(--muted); padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }
  .tab-btn.tab-creative.active { border-bottom-color: var(--blue); color: var(--blue); }
  .tab-btn.tab-adv.active { border-bottom-color: var(--red); color: var(--red); }
  .tab-btn.tab-red.active { border-bottom-color: var(--orange); color: var(--orange); }
  .chart-wrap canvas { cursor: pointer; }
  .drill-hint { font-size: 10px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }

  .filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filter-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; outline: none; min-width: 140px; }
  select:focus { border-color: var(--blue); }
  .btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .2s; }
  .btn-clear:hover { color: var(--text); border-color: var(--muted); }

  /* Multi-select dropdown */
  .ms-wrap { position: relative; display: inline-block; }
  .ms-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-width: 140px; display: flex; align-items: center; justify-content: space-between; gap: 8px; white-space: nowrap; transition: border-color .2s; }
  .ms-btn:hover, .ms-btn.open { border-color: var(--blue); outline: none; }
  .ms-arrow { color: var(--muted); font-size: 10px; flex-shrink: 0; transition: transform .2s; }
  .ms-btn.open .ms-arrow { transform: rotate(180deg); }
  .ms-panel { position: absolute; top: calc(100% + 4px); left: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; min-width: 220px; max-height: 300px; overflow-y: auto; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .ms-search { padding: 8px; position: sticky; top: 0; background: var(--surface2); border-bottom: 1px solid var(--border); z-index: 1; }
  .ms-search input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; outline: none; }
  .ms-search input:focus { border-color: var(--blue); }
  .ms-option { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; transition: background .15s; user-select: none; }
  .ms-option:hover { background: rgba(88,166,255,.08); }
  .ms-option input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .ms-divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
  .ms-count { background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }

  .main { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; transition: border-color .2s; }
  .kpi-card:hover { border-color: var(--blue); }
  .kpi-label { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; line-height: 1; }
  .kpi-sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .kpi-card.blue .kpi-value { color: var(--blue); }
  .kpi-card.green .kpi-value { color: var(--green); }
  .kpi-card.yellow .kpi-value { color: var(--yellow); }
  .kpi-card.red .kpi-value { color: var(--red); }
  .kpi-card.purple .kpi-value { color: var(--purple); }
  .kpi-card.orange .kpi-value { color: var(--orange); }

  .charts-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; margin-bottom: 20px; }
  .charts-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap.tall { height: 280px; }

  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .table-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-header h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .table-count { color: var(--muted); font-size: 12px; }
  .table-wrap { overflow-x: auto; max-height: 400px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface2); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; position: sticky; top: 0; white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-aprovado { background: #1a4731; color: var(--green); }
  .badge-finalizado { background: #0d2d6b; color: var(--blue); }
  .badge-producao { background: #2d1f4b; color: var(--purple); }
  .badge-revisao { background: #3d2d0d; color: var(--yellow); }
  .badge-cancelada { background: #3d1515; color: var(--red); }
  .badge-erro { background: #4d1010; color: #ff6b6b; }
  .badge-fila { background: #1a2a3a; color: #79c0ff; }
  .badge-default { background: var(--surface2); color: var(--muted); }

  .loading { display: flex; align-items: center; justify-content: center; min-height: 300px; flex-direction: column; gap: 12px; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .token-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .token-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 440px; width: 100%; }
  .token-card h2 { margin-bottom: 8px; font-size: 20px; }
  .token-card p { color: var(--muted); margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
  .token-input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; font-family: monospace; margin-bottom: 12px; }
  .token-input:focus { outline: none; border-color: var(--blue); }
  .btn-connect { width: 100%; background: var(--blue); color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

  .empty { text-align: center; padding: 40px; color: var(--muted); }

  @media (max-width: 900px) {
    .charts-grid, .charts-grid.three { grid-template-columns: 1fr; }
    .filters { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="tokenScreen" class="token-screen">
  <div class="token-card">
    <h2>🎨 Dashboard Creative 2026</h2>
    <p>Conecte ao Notion para visualizar as demandas em tempo real. O token fica salvo no navegador.</p>
    <input id="tokenInput" class="token-input" type="password" placeholder="ntn_..." value="">
    <button class="btn-connect" onclick="connect()">Conectar ao Notion</button>
    <p id="tokenError" style="color:var(--red);font-size:12px;margin-top:8px;display:none;"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <h1>🎨 <span>Dashboard Creative</span> 2026</h1>
    <div class="header-right">
      <span class="last-updated" id="lastUpdated">—</span>
      <button class="btn-refresh" id="btnRefresh" onclick="loadData()">↻ Atualizar</button>
      <button class="btn-clear" onclick="logout()" style="font-size:11px;">Sair</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="setTab('geral',this)">📊 Geral</button>
    <button class="tab-btn tab-creative" onclick="setTab('creative',this)">🔵 CREATIVE</button>
    <button class="tab-btn tab-adv" onclick="setTab('adv',this)">🔴 AUDIOVISUAL</button>
    <button class="tab-btn tab-red" onclick="setTab('red',this)">🟠 REDAÇÃO</button>
  </div>

  <div class="filters" id="filtersBar">
    <span class="filter-label">Filtros:</span>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fStatus" onclick="toggleMs('fStatus')"><span id="lbl-fStatus">Todos os Status</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fStatus" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fTipo" onclick="toggleMs('fTipo')"><span id="lbl-fTipo">Todos os Tipos</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fTipo" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fArea" onclick="toggleMs('fArea')"><span id="lbl-fArea">Todas as Áreas</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fArea" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fAreaDem" onclick="toggleMs('fAreaDem')"><span id="lbl-fAreaDem">Todas as BUs</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fAreaDem" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fAreaTask" onclick="toggleMs('fAreaTask')"><span id="lbl-fAreaTask">Área de Task</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fAreaTask" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fCreative" onclick="toggleMs('fCreative')"><span id="lbl-fCreative">Todos os Criativos</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fCreative" style="display:none;"></div></div>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fNomeFreelancer" onclick="toggleMs('fNomeFreelancer')"><span id="lbl-fNomeFreelancer">Nome Freelancer</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fNomeFreelancer" style="display:none;"></div></div>
    <select id="fFreelancer" onchange="applyFilters()">
      <option value="">Interno + Freelancer</option>
      <option value="1">Freelancer</option>
      <option value="0">Interno</option>
    </select>
    <select id="fRevisoes" onchange="applyFilters()">
      <option value="">Nº Revisões (todos)</option>
      <option value="0">0 revisões</option>
      <option value="1">1 revisão</option>
      <option value="2">2 revisões</option>
      <option value="3+">3+ revisões</option>
    </select>
    <select id="fForaSLA" onchange="applyFilters()">
      <option value="">SLA (todos)</option>
      <option value="1">Fora do SLA</option>
      <option value="0">Dentro do SLA</option>
    </select>
    <select id="fAprovadoPrimeira" onchange="applyFilters()">
      <option value="">Aprovação (todos)</option>
      <option value="1">Aprovado de 1ª</option>
      <option value="0">Não aprovado de 1ª</option>
    </select>
    <select id="fIniciativa" onchange="applyFilters()">
      <option value="">Iniciativa Creative (todos)</option>
      <option value="1">Iniciativa Creative</option>
      <option value="0">Não é iniciativa</option>
    </select>
    <div class="ms-wrap"><button class="ms-btn" id="btn-fMes" onclick="toggleMs('fMes')"><span id="lbl-fMes">Todos os Meses</span><span class="ms-arrow">▾</span></button><div class="ms-panel" id="panel-fMes" style="display:none;"></div></div>
    <button class="btn-clear" onclick="clearFilters()">✕ Limpar</button>
  </div>

  <div class="main" id="mainContent">
    <div class="loading"><div class="spinner"></div><span>Carregando dados...</span></div>
  </div>
  <div id="drillPanel" style="display:none; padding: 0 24px 20px; max-width:1600px; margin:0 auto;"></div>
</div>

<script>
const DB_ID     = '2e0b431349e180498fe0cbaf43c58f21';
// ADV está no mesmo banco 2026 — identificado pelo campo 'Etapa' (não 'Status')
const ADV_DB_ID = DB_ID;
let TOKEN = '';
let allData = [];
let advData = [];      // database separada do Audiovisual
let advLoaded = false;
let filteredData = [];
let charts = {};

let activeTab = 'geral';

function getBaseData() {
  return activeTab === 'adv' ? advData : allData;
}

function filterRaw(raw) {
  return raw.filter(p => {
    const ct = p.properties['Criado em']?.created_time;
    if (!ct || !ct.startsWith('2026')) return false;
    const status = p.properties.Status?.status?.name;
    if (!status) return false;
    return !['Em Construção', 'ERRO', 'Erro'].includes(status);
  });
}

async function setTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  // Repopula filtros e limpa seleções ao trocar de aba
  ['fStatus','fTipo','fArea','fAreaDem','fAreaTask','fCreative','fNomeFreelancer','fMes']
    .forEach(id => clearMsFilter(id));
  ['fFreelancer','fRevisoes','fForaSLA','fAprovadoPrimeira','fIniciativa']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });

  // Esconde filtros que não fazem sentido no ADV
  const advOnlyHide = ['fFreelancer','fRevisoes','fForaSLA','fAprovadoPrimeira','fIniciativa'];
  advOnlyHide.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = (tab === 'adv') ? 'none' : '';
  });

  populateFilters();

  // Pré-seleciona a Área correspondente à aba clicada
  const areaPreset = { creative: 'CREATIVE', adv: 'AUDIOVISUAL' };
  if (areaPreset[tab]) setMsFilter('fArea', areaPreset[tab]);

  applyFilters();
}

function getTabData(data) {
  if (activeTab === 'creative') return data.filter(p => (p.properties['ÁREA']?.multi_select||[]).some(a => a.name === 'CREATIVE'));
  if (activeTab === 'adv') return data; // já é a database ADV inteira
  if (activeTab === 'red') return data.filter(p => (p.properties['Tipo de Demanda']?.select?.name || '').toUpperCase().startsWith('RED'));
  return data;
}

function connect() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  TOKEN = t;
  localStorage.setItem('notion_token_dash', t);
  document.getElementById('tokenScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}

function logout() {
  localStorage.removeItem('notion_token_dash');
  location.reload();
}

const saved = localStorage.getItem('notion_token_dash');
if (saved) {
  TOKEN = saved;
  document.getElementById('tokenInput').value = saved;
  document.getElementById('tokenScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function notionFetch(path, method, body) {
  const target = encodeURIComponent(`https://api.notion.com${path}`);
  const proxyUrl = `https://corsproxy.io/?${target}`;

  const resp = await fetch(proxyUrl, {
    method: method || 'GET',
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined
  });

  if (!resp.ok) {
    let err = {};
    try { err = await resp.json(); } catch(e) {}
    throw new Error(err.message || `Erro HTTP ${resp.status}`);
  }
  return resp.json();
}

async function fetchAllFromDb(dbId) {
  let results = [], cursor = null;
  do {
    const body = { page_size: 100, sorts: [{ property: 'Criado em', direction: 'descending' }] };
    if (cursor) body.start_cursor = cursor;
    const d = await notionFetch(`/v1/databases/${dbId}/query`, 'POST', body);
    results = results.concat(d.results || []);
    cursor = d.has_more ? d.next_cursor : null;
  } while (cursor);
  return results;
}

async function fetchAll() { return fetchAllFromDb(DB_ID); }

// Retorna o status do registro considerando o campo correto por aba
function getPropStatus(props) {
  return activeTab === 'adv'
    ? (props['Etapa']?.status?.name || '')
    : (props['Status']?.status?.name || '');
}

async function loadData() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = '⟳ Carregando...';
  document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner"></div><span>Carregando dados...</span></div>';

  try {
    const raw = await fetchAll();
    allData = filterRaw(raw);

    // ADV: mesmo banco 2026, mas usa campo 'Etapa' (não 'Status')
    // Separamos aqui para não fazer fetch extra
    // Diagnóstico: descobre a estrutura real dos registros ADV
    const raw2026 = raw.filter(p => (p.properties['Criado em']?.created_time||'').startsWith('2026'));
    const allKeys = raw2026.length > 0 ? Object.keys(raw2026[0].properties) : [];
    // Conta registros por AREA
    const areaCount = {};
    raw2026.forEach(p => {
      (p.properties['ÁREA']?.multi_select||[]).forEach(a => { areaCount[a.name] = (areaCount[a.name]||0)+1; });
    });
    // Conta tipos começando com ADV
    const advTipos = raw2026.filter(p => (p.properties['Tipo de Demanda']?.select?.name||'').toUpperCase().startsWith('ADV'));
    const areaAudiovisual = raw2026.filter(p => (p.properties['ÁREA']?.multi_select||[]).some(a => a.name.toUpperCase().includes('AUDIO')));
    window._advDiag = {
      total: raw.length, raw2026: raw2026.length,
      advTipos: advTipos.length, areaAudiovisual: areaAudiovisual.length,
      areaCount: JSON.stringify(areaCount).slice(0, 200),
      allKeys: allKeys.join(', ')
    };

    // Por enquanto usa tipo ADV ou AREA AUDIOVISUAL
    advData = raw2026.filter(p => {
      const areas = (p.properties['ÁREA']?.multi_select||[]).map(a => a.name.toUpperCase());
      const tipo = (p.properties['Tipo de Demanda']?.select?.name||'').toUpperCase();
      const status = p.properties['Status']?.status?.name;
      if (!status || ['Em Construção','ERRO','Erro'].includes(status)) return false;
      return areas.some(a => a.includes('AUDIO')) || tipo.startsWith('ADV');
    });
    advLoaded = true;

    populateFilters();
    applyFilters();
    document.getElementById('lastUpdated').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="loading"><p style="color:var(--red)">Erro: ${e.message}</p><p style="color:var(--muted);font-size:12px;margin-top:8px;">Verifique o token e permissões do Notion</p><button class="btn-clear" onclick="logout()" style="margin-top:12px;">Trocar token</button></div>`;
  }
  btn.disabled = false; btn.textContent = '↻ Atualizar';
}

// ── Multi-select ─────────────────────────────────────────────────────────────
const msState = {};
const msPlaceholder = {
  fStatus:'Todos os Status', fTipo:'Todos os Tipos', fArea:'Todas as Áreas',
  fAreaDem:'Todas as BUs', fAreaTask:'Área de Task', fCreative:'Todos os Criativos',
  fNomeFreelancer:'Nome Freelancer', fMes:'Todos os Meses'
};

function toggleMs(id) {
  const panel = document.getElementById('panel-'+id);
  const btn   = document.getElementById('btn-'+id);
  const isOpen = panel.style.display !== 'none';
  document.querySelectorAll('.ms-panel').forEach(p => p.style.display='none');
  document.querySelectorAll('.ms-btn').forEach(b => b.classList.remove('open'));
  if (!isOpen) { panel.style.display='block'; btn.classList.add('open'); }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-panel').forEach(p => p.style.display='none');
    document.querySelectorAll('.ms-btn').forEach(b => b.classList.remove('open'));
  }
});

document.addEventListener('change', e => {
  if (e.target.classList.contains('ms-all-cb')) {
    const id = e.target.dataset.id;
    if (!msState[id]) msState[id] = new Set();
    msState[id].clear();
    document.querySelectorAll(`#panel-${id} .ms-item-cb`).forEach(cb => cb.checked=false);
    e.target.checked = true;
    updateMsBtn(id); applyFilters();
  } else if (e.target.classList.contains('ms-item-cb')) {
    const id  = e.target.dataset.id;
    const val = e.target.dataset.value;
    if (!msState[id]) msState[id] = new Set();
    e.target.checked ? msState[id].add(val) : msState[id].delete(val);
    const allCb = document.querySelector(`#panel-${id} .ms-all-cb`);
    if (allCb) allCb.checked = msState[id].size === 0;
    updateMsBtn(id); applyFilters();
  }
});

document.addEventListener('input', e => {
  if (e.target.classList.contains('ms-search-input')) {
    const id = e.target.dataset.target;
    const q  = e.target.value.toLowerCase();
    document.querySelectorAll(`#panel-${id} label[data-search]`).forEach(opt => {
      opt.style.display = !q || opt.dataset.search.includes(q) ? '' : 'none';
    });
  }
});

function updateMsBtn(id) {
  const lbl = document.getElementById('lbl-'+id);
  if (!lbl) return;
  const count = msState[id] ? msState[id].size : 0;
  const base  = msPlaceholder[id] || id;
  lbl.innerHTML = count > 0 ? `${base} <span class="ms-count">${count}</span>` : base;
}

function getMsValues(id) {
  return msState[id] && msState[id].size > 0 ? msState[id] : null;
}

function fillMultiSelect(id, set, labelFn) {
  const panel = document.getElementById('panel-'+id);
  if (!panel) return;
  if (!msState[id]) msState[id] = new Set();
  const selected = msState[id];
  const values   = [...set].sort();
  let html = `<div class="ms-search"><input type="text" class="ms-search-input" data-target="${id}" placeholder="Buscar..."></div>`;
  html += `<label class="ms-option"><input type="checkbox" class="ms-all-cb" data-id="${id}"${selected.size===0?' checked':''}> Todos</label><hr class="ms-divider">`;
  values.forEach(v => {
    const label = labelFn ? labelFn(v) : v;
    const esc   = v.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    html += `<label class="ms-option" data-search="${label.toLowerCase()}"><input type="checkbox" class="ms-item-cb" data-id="${id}" data-value="${esc}"${selected.has(v)?' checked':''}> ${label}</label>`;
  });
  panel.innerHTML = html;
}

function clearMsFilter(id) {
  if (msState[id]) msState[id].clear();
  const panel = document.getElementById('panel-'+id);
  if (panel) {
    panel.querySelectorAll('.ms-item-cb').forEach(cb => cb.checked=false);
    const allCb = panel.querySelector('.ms-all-cb');
    if (allCb) allCb.checked = true;
  }
  updateMsBtn(id);
}

// Pré-seleciona valores num multi-select (chamado após populateFilters)
function setMsFilter(id, ...values) {
  if (!msState[id]) msState[id] = new Set();
  msState[id].clear();
  values.forEach(v => msState[id].add(v));
  const panel = document.getElementById('panel-' + id);
  if (panel) {
    panel.querySelectorAll('.ms-item-cb').forEach(cb => {
      cb.checked = msState[id].has(cb.dataset.value);
    });
    const allCb = panel.querySelector('.ms-all-cb');
    if (allCb) allCb.checked = msState[id].size === 0;
  }
  updateMsBtn(id);
}

function populateFilters() {
  const statuses = new Set(), tipos = new Set(), areas = new Set(), areasDem = new Set();
  const creatives = new Set(), meses = new Set(), projetos = new Set();
  const nomesFreelancer = new Set(), areasTask = new Set();

  getBaseData().forEach(p => {
    const props = p.properties;
    const s = getPropStatus(props); if (s) statuses.add(s);
    const t = props['Tipo de Demanda']?.select?.name; if (t) tipos.add(t);
    (props['ÁREA']?.multi_select || []).forEach(a => areas.add(a.name));
    (props['Área Demandadora']?.multi_select || []).forEach(a => areasDem.add(a.name));
    (props['Creative']?.people || []).forEach(c => creatives.add(c.name));
    const at = props['Área de Task']?.select?.name; if (at) areasTask.add(at);
    const nf = props['Nome Freelancer']?.rich_text?.[0]?.plain_text; if (nf) nomesFreelancer.add(nf);
    // (meses gerados estaticamente abaixo — não depende dos dados)
  });

  // Gera todos os meses de jan/2026 até o mês atual, independente dos dados
  const _now = new Date();
  const _curYear = _now.getFullYear();
  const _curMonth = _now.getMonth() + 1;
  for (let y = 2026; y <= _curYear; y++) {
    const endM = (y < _curYear) ? 12 : _curMonth;
    for (let m = 1; m <= endM; m++) {
      meses.add(`${y}-${String(m).padStart(2,'0')}`);
    }
  }

  // ADV: mostra todos os tipos da database; outros: só CRT/ADV/RED
  const tiposFiltrados = activeTab === 'adv'
    ? tipos
    : new Set([...tipos].filter(t => /^(CRT|ADV|RED)/i.test(t)));

  // Membros fixos por time
  if (activeTab === 'creative' || activeTab === 'geral') {
    ['Neemias Araujo do Amaral','Flávia Lima','Matheus Pio Nunes Gonçalves','Vitor Santos Serodeo','Pedro Marcondes']
      .forEach(n => creatives.add(n));
  }
  if (activeTab === 'red') {
    ['Sarah Vitório','Juliana Cespedes','Marcella Mancinelli','Tici Fonseca']
      .forEach(n => creatives.add(n));
  }
  if (activeTab === 'adv') {
    ['Wilson Silva','Raffaela Lima','Flávio Rocha','Gui Juhas','Lucas Liberato',
     'Amanda Rui','Joyce Moraes','Taína Vilhena','Diego Picasso','Yasmin Galdino',
     'Gustavo Cairo','Eric Correa','Jaque Germano'].forEach(n => creatives.add(n));
  }

  fillMultiSelect('fStatus', statuses);
  fillMultiSelect('fTipo', tiposFiltrados);
  fillMultiSelect('fArea', areas);
  fillMultiSelect('fAreaDem', areasDem);
  fillMultiSelect('fAreaTask', areasTask);
  fillMultiSelect('fCreative', creatives);
  fillMultiSelect('fNomeFreelancer', nomesFreelancer);
  fillMultiSelect('fMes', meses, v => {
    const [y, m] = v.split('-');
    return new Date(y, m-1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  });
}

function fillSelect(id, set, labelFn) {
  const el = document.getElementById(id);
  const current = el.value;
  const first = el.options[0];
  el.innerHTML = '';
  el.appendChild(first);
  [...set].sort().forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = labelFn ? labelFn(v) : v;
    el.appendChild(opt);
  });
  el.value = current;
}

function applyFilters() {
  const fStatus        = getMsValues('fStatus');
  const fTipo          = getMsValues('fTipo');
  const fArea          = getMsValues('fArea');
  const fAreaDem       = getMsValues('fAreaDem');
  const fAreaTask      = getMsValues('fAreaTask');
  const fCreative      = getMsValues('fCreative');
  const fNomeFreelancer = getMsValues('fNomeFreelancer');
  const fMes           = getMsValues('fMes');
  const fFreelancer      = document.getElementById('fFreelancer').value;
  const fRevisoes        = document.getElementById('fRevisoes').value;
  const fForaSLA         = document.getElementById('fForaSLA').value;
  const fAprovadoPrimeira = document.getElementById('fAprovadoPrimeira').value;
  const fIniciativa      = document.getElementById('fIniciativa').value;

  filteredData = getBaseData().filter(p => {
    const props = p.properties;
    if (fStatus && !fStatus.has(getPropStatus(props))) return false;
    if (fTipo   && !fTipo.has(props['Tipo de Demanda']?.select?.name)) return false;
    if (fArea   && !(props['ÁREA']?.multi_select||[]).some(a => fArea.has(a.name))) return false;
    if (fAreaDem && !(props['Área Demandadora']?.multi_select||[]).some(a => fAreaDem.has(a.name))) return false;
    if (fAreaTask && !fAreaTask.has(props['Área de Task']?.select?.name)) return false;
    if (fCreative && !(props['Creative']?.people||[]).some(c => fCreative.has(c.name))) return false;
    if (fFreelancer === '1' && !props['Freelancer']?.checkbox) return false;
    if (fFreelancer === '0' && props['Freelancer']?.checkbox) return false;
    if (fNomeFreelancer) {
      const nf = props['Nome Freelancer']?.rich_text?.[0]?.plain_text || '';
      if (!fNomeFreelancer.has(nf)) return false;
    }
    if (fRevisoes) {
      const rev = props['Nº de Revisões']?.number || 0;
      if (fRevisoes === '0' && rev !== 0) return false;
      if (fRevisoes === '1' && rev !== 1) return false;
      if (fRevisoes === '2' && rev !== 2) return false;
      if (fRevisoes === '3+' && rev < 3) return false;
    }
    if (fForaSLA === '1' && !props['Fora de SLA?']?.checkbox) return false;
    if (fForaSLA === '0' && props['Fora de SLA?']?.checkbox) return false;
    if (fAprovadoPrimeira === '1' && !props['Aprovado de Primeira?']?.checkbox) return false;
    if (fAprovadoPrimeira === '0' && props['Aprovado de Primeira?']?.checkbox) return false;
    if (fIniciativa === '1' && !props['Iniciativa Creative']?.checkbox) return false;
    if (fIniciativa === '0' && props['Iniciativa Creative']?.checkbox) return false;
    if (fMes) {
      const criado = props['Criado em']?.created_time;
      if (!criado) return false;
      const d = new Date(criado);
      const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!fMes.has(m)) return false;
    }
    return true;
  });

  filteredData = getTabData(filteredData);
  render();
}

function clearFilters() {
  ['fStatus','fTipo','fArea','fAreaDem','fAreaTask','fCreative','fNomeFreelancer','fMes'].forEach(id => clearMsFilter(id));
  ['fFreelancer','fRevisoes','fForaSLA','fAprovadoPrimeira','fIniciativa'].forEach(id => document.getElementById(id).value = '');
  applyFilters();
}

let sortKey = 'criado', sortDir = -1;
function sortTable(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  renderTable();
}

function renderTable() {
  const body = document.getElementById('tableBody');
  if (!body) return;

  const rows = [...filteredData].sort((a, b) => {
    const pa = a.properties, pb = b.properties;
    let va, vb;
    if (sortKey === 'id') { va = pa.ID?.unique_id?.number||0; vb = pb.ID?.unique_id?.number||0; }
    else if (sortKey === 'title') { va = getTitle(pa); vb = getTitle(pb); }
    else if (sortKey === 'status') { va = pa.Status?.status?.name||''; vb = pb.Status?.status?.name||''; }
    else if (sortKey === 'tipo') { va = pa['Tipo de Demanda']?.select?.name||''; vb = pb['Tipo de Demanda']?.select?.name||''; }
    else if (sortKey === 'area') { va = (pa['ÁREA']?.multi_select||[]).map(x=>x.name).join(','); vb = (pb['ÁREA']?.multi_select||[]).map(x=>x.name).join(','); }
    else if (sortKey === 'bu') { va = (pa['Área Demandadora']?.multi_select||[]).map(x=>x.name).join(','); vb = (pb['Área Demandadora']?.multi_select||[]).map(x=>x.name).join(','); }
    else if (sortKey === 'creative') { va = (pa['Creative']?.people||[]).map(x=>x.name).join(','); vb = (pb['Creative']?.people||[]).map(x=>x.name).join(','); }
    else if (sortKey === 'prazo') { va = pa['📅 Prazo entrega']?.date?.start||''; vb = pb['📅 Prazo entrega']?.date?.start||''; }
    else { va = pa['Criado em']?.created_time||''; vb = pb['Criado em']?.created_time||''; }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  body.innerHTML = rows.slice(0, 200).map(p => {
    const props = p.properties;
    const uid = props.ID?.unique_id;
    const id = uid ? `${uid.prefix||''}-${uid.number}` : '—';
    const title = getTitle(props);
    const status = getPropStatus(props) || '—';
    const tipo = props['Tipo de Demanda']?.select?.name || '—';
    const area = (props['ÁREA']?.multi_select||[]).map(a=>a.name).join(', ') || '—';
    const bu = (props['Área Demandadora']?.multi_select||[]).map(a=>a.name).join(', ') || '—';
    const creative = (props['Creative']?.people||[]).map(c=>c.name).join(', ') || '—';
    const prazo = props['📅 Prazo entrega']?.date?.start ? new Date(props['📅 Prazo entrega'].date.start).toLocaleDateString('pt-BR') : '—';
    const criado = props['Criado em']?.created_time ? new Date(props['Criado em'].created_time).toLocaleDateString('pt-BR') : '—';
    const url = p.url || '#';
    const badgeClass = statusBadge(status);
    return `<tr>
      <td style="color:var(--muted);font-family:monospace;font-size:11px;">${id}</td>
      <td><a href="${url}" target="_blank" style="color:var(--blue);text-decoration:none;" title="${title}">${title.substring(0,50)}${title.length>50?'…':''}</a></td>
      <td><span class="badge ${badgeClass}">${status}</span></td>
      <td>${tipo}</td>
      <td>${area}</td>
      <td>${bu}</td>
      <td>${creative}</td>
      <td>${prazo}</td>
      <td style="color:var(--muted)">${criado}</td>
    </tr>`;
  }).join('');

  if (rows.length > 200) {
    document.getElementById('tableCount').textContent = `${filteredData.length} resultados (exibindo 200)`;
  }
}

function getTitle(props) {
  const t = props['']?.title || [];
  return t.map(x=>x.plain_text).join('') || '(sem título)';
}

function statusBadge(s) {
  const m = {
    // CREATIVE / GERAL
    'Aprovado':'badge-aprovado','Aprovado':'badge-aprovado',
    'Finalizado':'badge-finalizado','Em produção':'badge-producao',
    'Revisão':'badge-revisao','Aprovação pendente':'badge-revisao',
    'Cancelada':'badge-cancelada','ERRO':'badge-erro','Na fila':'badge-fila',
    // ADV
    'Cancelado':'badge-cancelada',
    'Em Revisão':'badge-revisao',
    'Para aprovação':'badge-revisao',
    'Para Edição':'badge-fila',
    'Backlog':'badge-fila',
    'Produção':'badge-producao',
    'Editando':'badge-producao',
    'Gravação':'badge-producao',
    'Produção Blocked':'badge-erro',
    'Blocked':'badge-erro',
    'Freela':'badge-default',
  };
  return m[s] || 'badge-default';
}

const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#ffa657','#39d353','#79c0ff','#f0883e','#56d364'];

const tooltipPlugin = {
  plugins: {
    tooltip: {
      backgroundColor: '#21262d',
      titleColor: '#e6edf3',
      bodyColor: '#8b949e',
      borderColor: '#30363d',
      borderWidth: 1,
      padding: 10,
      callbacks: {
        label: function(ctx) {
          const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
          const val = ctx.parsed.y ?? ctx.parsed ?? ctx.raw;
          const pct = total > 0 ? Math.round(val/total*100) : 0;
          return ` ${val} demandas (${pct}%)`;
        }
      }
    }
  }
};

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function makeTooltipWithDrill(drillKey, labelKeyFn) {
  return {
    backgroundColor: '#21262d', titleColor: '#e6edf3', bodyColor: '#8b949e',
    borderColor: '#30363d', borderWidth: 1, padding: 10,
    callbacks: {
      label: function(ctx) {
        const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
        const val = ctx.parsed?.y ?? ctx.parsed ?? ctx.raw;
        const pct = total > 0 ? Math.round(val/total*100) : 0;
        return ` ${val} demandas (${pct}%)`;
      },
      afterBody: function(tooltipItems) {
        if (!drillKey) return [];
        const rawLabel = tooltipItems[0]?.label;
        const key = labelKeyFn ? labelKeyFn(rawLabel) : rawLabel;
        const items = drillMap[drillKey]?.[key] || [];
        if (!items.length) return [];
        const lines = [''];
        items.slice(0, 6).forEach(p => {
          const t = getTitle(p.properties);
          lines.push(' • ' + (t.length > 44 ? t.substring(0, 44) + '…' : t));
        });
        if (items.length > 6) lines.push(` + ${items.length - 6} mais`);
        lines.push('', '↙️ Clique para ver todas');
        return lines;
      }
    }
  };
}

function drawDoughnut(id, data, drillKey) {
  const sorted = Object.entries(data).sort((a,b) => b[1]-a[1]);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: sorted.map(x=>x[0]), datasets: [{ data: sorted.map(x=>x[1]), backgroundColor: COLORS, borderWidth: 2, borderColor: '#161b22' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      onClick: (_, els) => { if (els.length) showDrillDown(drillKey, sorted[els[0].index][0]); },
      plugins: { tooltip: makeTooltipWithDrill(drillKey), legend: { position: 'right', labels: { color: '#8b949e', font: { size: 11 }, padding: 8, boxWidth: 12 } } }
    }
  });
}

function drawBar(id, data, color, drillKey) {
  const sorted = Object.entries(data).sort((a,b) => b[1]-a[1]).slice(0,10);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels: sorted.map(x=>x[0]), datasets: [{ data: sorted.map(x=>x[1]), backgroundColor: color || COLORS[0], borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      onClick: (_, els) => { if (els.length) showDrillDown(drillKey, sorted[els[0].index][0]); },
      plugins: { tooltip: makeTooltipWithDrill(drillKey), legend: { display: false } },
      scales: { x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } }, y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } } }
    }
  });
}

function drawHBar(id, data, drillKey) {
  const sorted = Object.entries(data).sort((a,b) => b[1]-a[1]).slice(0,10);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels: sorted.map(x=>x[0]), datasets: [{ data: sorted.map(x=>x[1]), backgroundColor: COLORS, borderRadius: 4 }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      onClick: (_, els) => { if (els.length) showDrillDown(drillKey, sorted[els[0].index][0]); },
      plugins: { tooltip: makeTooltipWithDrill(drillKey), legend: { display: false } },
      scales: { x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }, y: { ticks: { color: '#8b949e', font: { size: 11 } }, grid: { color: '#21262d' } } }
    }
  });
}

let lineKeyMap = {};
function drawLine(id, data) {
  const sortedKeys = Object.keys(data).sort();
  const monthNames = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const labels = sortedKeys.map(k => {
    const [y, m] = k.split('-');
    return `${monthNames[parseInt(m,10)-1]}/${String(y).slice(-2)}`;
  });
  lineKeyMap = {};
  sortedKeys.forEach((k, i) => { lineKeyMap[labels[i]] = k; });
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: [{ label: 'Demandas', data: sortedKeys.map(k=>data[k]), borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.4, pointBackgroundColor: '#58a6ff', pointRadius: 5 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      onClick: (_, els) => { if (els.length) showDrillDown('month', sortedKeys[els[0].index]); },
      plugins: { tooltip: makeTooltipWithDrill('month', lbl => lineKeyMap[lbl] || lbl), legend: { display: false } },
      scales: { x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }, y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } } }
    }
  });
}

if (saved) loadData();
</script>
